[package]
authors = ["Architect Financial Technologies LLC"]
categories = ["finance"]
description = "ArchitectX SDK"
documentation = "https://docs.rs/ax-exchange-sdk"
edition = "2024"
homepage = "https://architect.exchange"
keywords = ["trading", "finance"]
license = "AGPL-3.0-only"
name = "ax-exchange-sdk"
version = "14.2.13"

[features]
all = ["dep:schemars", "dep:utoipa"]
utoipa = ["dep:utoipa"]
schemars = ["dep:schemars"]
smoke-tests = ["tokio/macros", "tokio/rt-multi-thread"]
sqlx = ["dep:sqlx"]

[dependencies]
anyhow = "1.0.104"
dashmap = "6.2.1"
arc-swap = "1.9.3"
arcstr = "1.2.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["full"] }
enumflags2 = "0.7.12"
futures = "0.3.34"
lazy_static = "1.5.1"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = "1.43.0"
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", features = ["chrono"] }
sqlx = { version = "0.9.0", optional = true }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
ulid = "3.0.0"
url = "2.5.8"
utoipa = { version = "6.0.0", optional = true }
yawc = { version = "0.5.0", features = ["rustls-aws-lc-rs"] }

[dev-dependencies]
dotenv = "0.15.0"
insta = { version = "1.49.0", features = ["json"] }
regex = "1.13.1"
serde_urlencoded = "0.7.1"
simple_logger = "5.2.0"
tracing-subscriber = "0.3.23"
